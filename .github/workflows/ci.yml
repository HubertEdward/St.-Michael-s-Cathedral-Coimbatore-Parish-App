name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle the parishioner app (Android)
        run: npx expo export --platform android --output-dir ../../dist/mobile-android
        working-directory: apps/mobile
      - name: Build the admin web app
        run: npx expo export --platform web --output-dir ../../dist/admin-web
        working-directory: apps/admin
