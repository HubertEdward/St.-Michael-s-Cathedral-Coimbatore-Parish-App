name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle both apps for every parish
        run: |
          for build in parishes/*/build.json; do
            parish=$(basename "$(dirname "$build")")
            echo "::group::$parish"
            (cd apps/mobile && PARISH=$parish npx expo export --platform android --output-dir "../../dist/$parish/mobile-android")
            (cd apps/admin && PARISH=$parish npx expo export --platform web --output-dir "../../dist/$parish/admin-web")
            echo "::endgroup::"
          done
